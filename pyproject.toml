[project]
name = "mcp-router"
version = "0.1.0"
description = "A single MCP server that dynamically discovers and proxies other MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "pydantic>=2",
    "PyYAML>=6",
    "python-dotenv>=1",
    "typer>=0.12",
]

[project.scripts]
mcp-router = "mcp_router.cli:main"
mcp-router-server = "mcp_router.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: LLM/network end-to-end tests; excluded from the default suite"]
# The LLM/network tests are opt-in: `uv run pytest -m e2e`.
addopts = "-m 'not e2e'"
